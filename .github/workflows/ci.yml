name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: exoskeleton
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/worldinterface
          path: worldinterface
          ssh-key: ${{ secrets.DEPLOY_KEY_WI }}
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/actionqueue
          path: actionqueue
          ssh-key: ${{ secrets.DEPLOY_KEY_AQ }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all -- --check
        working-directory: exoskeleton

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: exoskeleton
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/worldinterface
          path: worldinterface
          ssh-key: ${{ secrets.DEPLOY_KEY_WI }}
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/actionqueue
          path: actionqueue
          ssh-key: ${{ secrets.DEPLOY_KEY_AQ }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            exoskeleton/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('exoskeleton/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --all --all-targets --no-default-features -- -D warnings
        working-directory: exoskeleton

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show available space (for debugging)
        run: df -h /

      - uses: actions/checkout@v4
        with:
          path: exoskeleton
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/worldinterface
          path: worldinterface
          ssh-key: ${{ secrets.DEPLOY_KEY_WI }}
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/actionqueue
          path: actionqueue
          ssh-key: ${{ secrets.DEPLOY_KEY_AQ }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "exoskeleton"

      - name: Run tests
        run: cargo test --workspace --no-default-features --no-fail-fast -- --test-threads=1
        working-directory: exoskeleton
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: exoskeleton
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/worldinterface
          path: worldinterface
          ssh-key: ${{ secrets.DEPLOY_KEY_WI }}
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/actionqueue
          path: actionqueue
          ssh-key: ${{ secrets.DEPLOY_KEY_AQ }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            exoskeleton/target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('exoskeleton/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
      - run: cargo doc --workspace --no-deps --no-default-features
        working-directory: exoskeleton
        env:
          RUSTDOCFLAGS: "-D warnings"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: exoskeleton
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/worldinterface
          path: worldinterface
          ssh-key: ${{ secrets.DEPLOY_KEY_WI }}
      - uses: actions/checkout@v4
        with:
          repository: zed-colonel/actionqueue
          path: actionqueue
          ssh-key: ${{ secrets.DEPLOY_KEY_AQ }}
      - run: >
          docker build
          --build-context actionqueue=actionqueue
          --build-context worldinterface=worldinterface
          -t exoskeleton:ci
          -f exoskeleton/docker/Dockerfile.vessel
          exoskeleton/
