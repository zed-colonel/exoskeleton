# Benchmark vessel configuration template.
#
# Usage: exo bench --config benchmarks/bench-vessel.toml --suite benchmarks/tasks/
#
# LLM Backend:
#   Set ANTHROPIC_PLATFORM_API_KEY in your environment for frontier mode.
#   Or configure [llm.local] for local model testing.

[vessel]
mission = "Benchmark runner - resolve coding tasks accurately and efficiently"
data_dir = "/tmp/exo-bench-template"
master_loop_interval_secs = 1

# --- LLM Backend (choose one) ---

# Frontier (Anthropic Claude)
[llm.frontier]
provider = "anthropic"
model = "claude-sonnet-4-20250514"
api_key_env = "ANTHROPIC_PLATFORM_API_KEY"

# Local (Ollama) — uncomment to use instead of frontier
# [llm.local]
# endpoint = "http://localhost:11434"
# model = "llama3.2:latest"
# api_format = "ollama"

[llm]
default_backend = "frontier"
max_output_tokens = 4096
timeout_secs = 120

# --- Inner Loop ---
[inner_loop]
enabled = true
max_steps_per_tick = 35
max_tokens_per_session = 500000
timeout_secs = 300
context_window_size = 3
doom_loop_threshold = 3

# --- Engine Timing ---
[cognitive]
tick_interval_ms = 50

# --- Tool Policy ---
[tool_policy]
default = "allow"

# --- Threads (disable non-essential to save tokens) ---
[threads]
threat_monitor_enabled = false
meta_cognition_enabled = false
creative_synthesis_enabled = false
initiative_enabled = false
self_critique_enabled = false
memory_consolidation_enabled = false
