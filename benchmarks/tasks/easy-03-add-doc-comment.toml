[task]
name = "easy-03-add-doc-comment"
repo_path = "../repos/sample-rust"
prompt = """Add a module-level doc comment to src/lib.rs describing this crate
as a utility library for configuration parsing, math helpers, and
string formatting. The doc comment should use //! syntax at the top of the file."""
timeout_secs = 300
max_steps = 15
max_ticks = 5

[verify]
command = "head -1 src/lib.rs | grep -q '//!'"
expected_exit_code = 0
