# Exoskeleton Docker Compose
#
# Quick start:
#   1. docker compose build
#   2. docker compose run -it vessel bootstrap    # interactive first-run wizard
#   3. docker compose up -d                       # start vessel daemon
#   4. Connect Observatory (see ~/src/observatory) or use the CLI
#
# After bootstrap, use `docker compose up/down` to start and stop.
# The vessel data persists in the mounted volume between runs.
#
# Multi-vessel (advanced):
#   docker compose --profile multi up
#
# Environment variables:
#   EXO_USER_ID / EXO_GROUP_ID  — host UID/GID for file ownership (default: 1000)
#   EXO_PORT                    — host port for vessel API (default: 7600)
#   EXO_DATA_DIR                — host path for persistent data (default: ./data/vessel)
#   ANTHROPIC_API_KEY           — Anthropic API key (if using Anthropic backend)
#   OPENAI_API_KEY              — OpenAI API key (if using OpenAI backend)

services:
  # ── Vessel ───────────────────────────────────────────────────────
  vessel:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vessel
      additional_contexts:
        actionqueue: ../../actionqueue
        worldinterface: ../../worldinterface
    ports:
      - "${EXO_PORT:-7600}:7600"
    volumes:
      - ${EXO_DATA_DIR:-./data/vessel}:/data
    environment:
      - EXO_USER_ID=${EXO_USER_ID:-1000}
      - EXO_GROUP_ID=${EXO_GROUP_ID:-1000}
      - EXO_DATA_DIR=/data
      - EXO_DAEMON_LISTEN=0.0.0.0:7600
      - RUST_LOG=${RUST_LOG:-info}
      # LLM API keys — pass through from host
      - ANTHROPIC_PLATFORM_API_KEY
      - OPENAI_API_KEY
    restart: unless-stopped

  # ── Multi-vessel: Vessel A ─────────────────────────────────────
  vessel-a:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vessel
      additional_contexts:
        actionqueue: ../../actionqueue
        worldinterface: ../../worldinterface
    profiles: ["multi"]
    ports:
      - "7600:7600"
    volumes:
      - ${EXO_DATA_DIR_A:-./data/vessel-a}:/data
    environment:
      - EXO_USER_ID=${EXO_USER_ID:-1000}
      - EXO_GROUP_ID=${EXO_GROUP_ID:-1000}
      - EXO_DATA_DIR=/data
      - EXO_DAEMON_LISTEN=0.0.0.0:7600
      - RUST_LOG=${RUST_LOG:-info}
      - ANTHROPIC_PLATFORM_API_KEY
      - OPENAI_API_KEY
    restart: unless-stopped

  # ── Multi-vessel: Vessel B ─────────────────────────────────────
  vessel-b:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vessel
      additional_contexts:
        actionqueue: ../../actionqueue
        worldinterface: ../../worldinterface
    profiles: ["multi"]
    ports:
      - "7601:7600"
    volumes:
      - ${EXO_DATA_DIR_B:-./data/vessel-b}:/data
    environment:
      - EXO_USER_ID=${EXO_USER_ID:-1000}
      - EXO_GROUP_ID=${EXO_GROUP_ID:-1000}
      - EXO_DATA_DIR=/data
      - EXO_DAEMON_LISTEN=0.0.0.0:7600
      - RUST_LOG=${RUST_LOG:-info}
      - ANTHROPIC_PLATFORM_API_KEY
      - OPENAI_API_KEY
    restart: unless-stopped
